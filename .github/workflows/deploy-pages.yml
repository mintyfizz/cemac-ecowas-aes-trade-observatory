name: Deploy static dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The deployed data is the committed static/data, rebuilt offline from
      # preserved raw snapshots (scripts/offline_rebuild.py). The previous
      # Databricks export step is intentionally removed from the deploy path
      # until the corrected notebooks have been rerun and their gold output
      # passes the same contract (see docs/methodology.md).
      - name: Validate frontend JavaScript
        run: |
          node --check static/js/charts.js
          node --check static/js/app_static.js

      - name: Validate Python scripts
        run: |
          python -m py_compile scripts/observatory_definitions.py scripts/offline_rebuild.py scripts/check_static_contract.py scripts/test_contract_mutations.py

      - name: Exact-identity contract checks on static data
        run: python scripts/check_static_contract.py

      - name: Contract checks catch known defects
        run: python scripts/test_contract_mutations.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
